repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: guard-eval-data
        name: guard frozen eval data (data/test, data/challenge)
        entry: python3 scripts/guard_eval_data.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-gold
        name: validate dev gold and synthetic world
        entry: uv run python scripts/validate_gold.py
        language: system
        pass_filenames: false
        files: ^(data/(dev|world)/|scripts/validate_gold\.py|triage/(parse|schemas)\.py)
